# Every module in one process, one PostgreSQL instance. Stage 6 replaces this with the full profile set.
modules:
  catalog:
    enabled: true
    datasource:
      url: jdbc:postgresql://localhost:5432/macro
      username: catalog_app
      password: catalog_app
      migration-username: catalog_migrator
      migration-password: catalog_migrator
