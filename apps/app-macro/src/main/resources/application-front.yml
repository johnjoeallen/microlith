# Group 'front': orders, notifications here, everything else over JSON-RPC at its group's port.
server:
  port: 9181
modules:
  catalog:
    enabled: false
    url: http://localhost:9182/rpc/catalog
  customers:
    enabled: false
    url: http://localhost:9183/rpc/customers
  pricing:
    enabled: false
    url: http://localhost:9182/rpc/pricing
  inventory:
    enabled: false
    url: http://localhost:9182/rpc/inventory
  payments:
    enabled: false
    url: http://localhost:9183/rpc/payments
  shipping:
    enabled: false
    url: http://localhost:9182/rpc/shipping
  notifications:
    enabled: true
  orders:
    enabled: true
