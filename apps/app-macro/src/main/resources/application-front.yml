# Group 'front': orders, notifications here, everything else over JSON-RPC at its group's port.
server:
  port: 8081
modules:
  catalog:
    enabled: false
    url: http://localhost:8082/rpc/catalog
  customers:
    enabled: false
    url: http://localhost:8083/rpc/customers
  pricing:
    enabled: false
    url: http://localhost:8082/rpc/pricing
  inventory:
    enabled: false
    url: http://localhost:8082/rpc/inventory
  payments:
    enabled: false
    url: http://localhost:8083/rpc/payments
  shipping:
    enabled: false
    url: http://localhost:8082/rpc/shipping
  notifications:
    enabled: true
  orders:
    enabled: true
