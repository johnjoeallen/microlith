# Group 'accounts': customers, payments here, everything else over JSON-RPC at its group's port.
server:
  port: 9183
modules:
  catalog:
    enabled: false
    url: http://localhost:9182/rpc/catalog
  customers:
    enabled: true
  pricing:
    enabled: false
    url: http://localhost:9182/rpc/pricing
  inventory:
    enabled: false
    url: http://localhost:9182/rpc/inventory
  payments:
    enabled: true
  shipping:
    enabled: false
    url: http://localhost:9182/rpc/shipping
  notifications:
    enabled: false
    url: http://localhost:9181/rpc/notifications
  orders:
    enabled: false
    url: http://localhost:9181/rpc/orders
