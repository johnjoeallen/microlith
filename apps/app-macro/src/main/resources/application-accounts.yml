# Group 'accounts': customers, payments here, everything else over JSON-RPC at its group's port.
server:
  port: 8083
modules:
  catalog:
    enabled: false
    url: http://localhost:8082/rpc/catalog
  customers:
    enabled: true
  pricing:
    enabled: false
    url: http://localhost:8082/rpc/pricing
  inventory:
    enabled: false
    url: http://localhost:8082/rpc/inventory
  payments:
    enabled: true
  shipping:
    enabled: false
    url: http://localhost:8082/rpc/shipping
  notifications:
    enabled: false
    url: http://localhost:8081/rpc/notifications
  orders:
    enabled: false
    url: http://localhost:8081/rpc/orders
