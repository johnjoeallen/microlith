# app-macro contains every module. Which ones run, and how they reach the others, comes ONLY from profiles
# (monolith, front/fulfilment/accounts, one per module, loopback-codec, loopback-http, split-dbs) or environment
# variables. This file holds what is true in every shape: the local demo databases and the web/readiness settings.
server:
  port: 9100
rpc:
  server:
    enabled: true
spring:
  application:
    name: app-macro
  profiles:
    default: monolith
    group:
      demo: dev
  threads:
    virtual:
      enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,modules
  health:
    probes:
      enabled: true
modules:
  catalog:
    datasource:
      url: jdbc:postgresql://localhost:5432/macro
      username: catalog_app
      password: catalog_app
      migration-username: catalog_migrator
      migration-password: catalog_migrator
  customers:
    datasource:
      url: jdbc:postgresql://localhost:5432/macro
      username: customers_app
      password: customers_app
      migration-username: customers_migrator
      migration-password: customers_migrator
  pricing:
