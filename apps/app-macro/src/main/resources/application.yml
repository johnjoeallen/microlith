server:
  port: 8080
rpc:
  server:
    enabled: true
spring:
  application:
    name: app-macro
  profiles:
    default: monolith
  threads:
    virtual:
      enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,modules
  health:
    probes:
      enabled: true
