      url: jdbc:postgresql://localhost:5433/macro
  inventory:
    datasource:
      url: jdbc:postgresql://localhost:5433/macro
  payments:
    datasource:
      url: jdbc:postgresql://localhost:5434/macro
  shipping:
    datasource:
      url: jdbc:postgresql://localhost:5433/macro
  notifications:
