# GENERATED by scripts/new-service-app.sh. Everything here can be overridden by environment variables
# (for example MODULES_NOTIFICATIONS_DATASOURCE_URL) or a profile.
server:
  port: 9188
rpc:
  server:
    enabled: true
spring:
  application:
    name: app-notifications-service
  profiles:
    group:
      demo: dev
  threads:
    virtual:
      enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
