# GENERATED by scripts/new-service-app.sh. Everything here can be overridden by environment variables
# (for example MODULES_ORDERS_DATASOURCE_URL) or a profile.
server:
  port: 9181
rpc:
  server:
    enabled: true
spring:
  application:
    name: app-orders-service
  profiles:
    group:
      demo: dev
  threads:
    virtual:
      enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,modules
  health:
    probes:
      enabled: true
modules:
  orders:
    enabled: true
    datasource:
      url: jdbc:postgresql://localhost:5432/macro
      username: orders_app
      password: orders_app
      migration-username: orders_migrator
      migration-password: orders_migrator
  customers:
    enabled: false
    url: http://localhost:9185/rpc/customers
  inventory:
    enabled: false
    url: http://localhost:9184/rpc/inventory
  notifications:
    enabled: false
    url: http://localhost:9188/rpc/notifications
  payments:
    enabled: false
    url: http://localhost:9186/rpc/payments
  pricing:
    enabled: false
    url: http://localhost:9183/rpc/pricing
  shipping:
    enabled: false
    url: http://localhost:9187/rpc/shipping

