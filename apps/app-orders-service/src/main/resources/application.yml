server:
  port: 8081
rpc:
  server:
    enabled: true
spring:
  application:
    name: app-orders-service
  threads:
    virtual:
      enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,modules
  health:
    probes:
      enabled: true
modules:
  orders:
    enabled: true
    datasource:
      url: jdbc:postgresql://localhost:5432/macro
      username: orders_app
      password: orders_app
      migration-username: orders_migrator
      migration-password: orders_migrator
  customers:
    enabled: false
    url: http://localhost:8085/rpc/customers
  pricing:
    enabled: false
    url: http://localhost:8083/rpc/pricing
  shipping:
    enabled: false
    url: http://localhost:8087/rpc/shipping
  inventory:
    enabled: false
    url: http://localhost:8084/rpc/inventory
  payments:
    enabled: false
    url: http://localhost:8086/rpc/payments
  notifications:
    enabled: false
    url: http://localhost:8088/rpc/notifications
