server:
  port: 8080
rpc:
  server:
    enabled: false
spring:
  application:
    name: app-modulith
  profiles:
    group:
      demo: dev
  threads:
    virtual:
      enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,modules
  health:
    probes:
      enabled: true
modules:
  catalog:
    enabled: true
    binding: local
    datasource:
      url: jdbc:postgresql://localhost:5432/macro
      username: catalog_app
      password: catalog_app
      migration-username: catalog_migrator
      migration-password: catalog_migrator
  customers:
    enabled: true
    binding: local
    datasource:
      url: jdbc:postgresql://localhost:5432/macro
      username: customers_app
      password: customers_app
      migration-username: customers_migrator
      migration-password: customers_migrator
  pricing:
    enabled: true
    binding: local
    datasource:
      url: jdbc:postgresql://localhost:5432/macro
      username: pricing_app
      password: pricing_app
      migration-username: pricing_migrator
      migration-password: pricing_migrator
  inventory:
    enabled: true
    binding: local
    datasource:
      url: jdbc:postgresql://localhost:5432/macro
      username: inventory_app
      password: inventory_app
      migration-username: inventory_migrator
      migration-password: inventory_migrator
  payments:
    enabled: true
    binding: local
    datasource:
      url: jdbc:postgresql://localhost:5432/macro
      username: payments_app
      password: payments_app
      migration-username: payments_migrator
      migration-password: payments_migrator
  shipping:
    enabled: true
    binding: local
    datasource:
      url: jdbc:postgresql://localhost:5432/macro
      username: shipping_app
      password: shipping_app
      migration-username: shipping_migrator
      migration-password: shipping_migrator
  notifications:
    enabled: true
    binding: local
    datasource:
      url: jdbc:postgresql://localhost:5432/macro
      username: notifications_app
      password: notifications_app
      migration-username: notifications_migrator
      migration-password: notifications_migrator
  orders:
    enabled: true
    binding: local
    datasource:
      url: jdbc:postgresql://localhost:5432/macro
      username: orders_app
      password: orders_app
      migration-username: orders_migrator
      migration-password: orders_migrator
