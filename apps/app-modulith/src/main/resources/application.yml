server:
  port: 8080
rpc:
  server:
    enabled: false
spring:
  application:
    name: app-modulith
  threads:
    virtual:
      enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,modules
  health:
    probes:
      enabled: true
modules:
  orders:
    enabled: true
    binding: local
    datasource:
      url: jdbc:postgresql://localhost:5432/macro
      username: orders_app
      password: orders_app
      migration-username: orders_migrator
      migration-password: orders_migrator
  inventory:
    enabled: true
    binding: local
    datasource:
      url: jdbc:postgresql://localhost:5432/macro
      username: inventory_app
      password: inventory_app
      migration-username: inventory_migrator
      migration-password: inventory_migrator
