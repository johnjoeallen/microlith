# GENERATED by scripts/new-service-app.sh. Everything here can be overridden by environment variables
# (for example MODULES_PRICING_DATASOURCE_URL) or a profile.
server:
  port: 8083
rpc:
  server:
    enabled: true
spring:
  application:
    name: app-pricing-service
  profiles:
    group:
      demo: dev
  threads:
    virtual:
      enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,modules
  health:
    probes:
      enabled: true
modules:
  pricing:
    enabled: true
    datasource:
      url: jdbc:postgresql://localhost:5432/macro
      username: pricing_app
      password: pricing_app
      migration-username: pricing_migrator
      migration-password: pricing_migrator
  catalog:
    enabled: false
    url: http://localhost:8082/rpc/catalog
  customers:
    enabled: false
    url: http://localhost:8085/rpc/customers

