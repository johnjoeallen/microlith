# GENERATED by scripts/new-service-app.sh. Everything here can be overridden by environment variables
# (for example MODULES_PAYMENTS_DATASOURCE_URL) or a profile.
server:
  port: 8086
rpc:
  server:
    enabled: true
spring:
  application:
    name: app-payments-service
  profiles:
    group:
      demo: dev
  threads:
    virtual:
      enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,modules
  health:
    probes:
      enabled: true
modules:
  payments:
    enabled: true
    datasource:
      url: jdbc:postgresql://localhost:5432/macro
      username: payments_app
      password: payments_app
      migration-username: payments_migrator
      migration-password: payments_migrator
  customers:
    enabled: false
    url: http://localhost:8085/rpc/customers

