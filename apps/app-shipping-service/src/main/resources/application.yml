# GENERATED by scripts/new-service-app.sh. Everything here can be overridden by environment variables
# (for example MODULES_SHIPPING_DATASOURCE_URL) or a profile.
server:
  port: 8087
rpc:
  server:
    enabled: true
spring:
  application:
    name: app-shipping-service
  profiles:
    group:
      demo: dev
  threads:
    virtual:
      enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,modules
  health:
    probes:
      enabled: true
modules:
  shipping:
    enabled: true
    datasource:
      url: jdbc:postgresql://localhost:5432/macro
      username: shipping_app
      password: shipping_app
      migration-username: shipping_migrator
      migration-password: shipping_migrator
  customers:
    enabled: false
    url: http://localhost:8085/rpc/customers
  inventory:
    enabled: false
    url: http://localhost:8084/rpc/inventory

