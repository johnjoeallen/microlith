server:
  port: 8084
rpc:
  server:
    enabled: true
spring:
  application:
    name: app-inventory-service
  threads:
    virtual:
      enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,modules
  health:
    probes:
      enabled: true
modules:
  inventory:
    enabled: true
    datasource:
      url: jdbc:postgresql://localhost:5433/macro
      username: inventory_app
      password: inventory_app
      migration-username: inventory_migrator
      migration-password: inventory_migrator
