# GENERATED by scripts/new-service-app.sh. Everything here can be overridden by environment variables
# (for example MODULES_INVENTORY_DATASOURCE_URL) or a profile.
server:
  port: 8084
rpc:
  server:
    enabled: true
spring:
  application:
    name: app-inventory-service
  profiles:
    group:
      demo: dev
  threads:
    virtual:
      enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,modules
  health:
    probes:
      enabled: true
modules:
  inventory:
    enabled: true
    datasource:
      url: jdbc:postgresql://localhost:5432/macro
      username: inventory_app
      password: inventory_app
      migration-username: inventory_migrator
      migration-password: inventory_migrator
  catalog:
    enabled: false
    url: http://localhost:8082/rpc/catalog

