# GENERATED by scripts/new-service-app.sh. Everything here can be overridden by environment variables
# (for example MODULES_CATALOG_DATASOURCE_URL) or a profile.
server:
  port: 8082
rpc:
  server:
    enabled: true
spring:
  application:
    name: app-catalog-service
  profiles:
    group:
      demo: dev
  threads:
    virtual:
      enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,modules
  health:
    probes:
      enabled: true
modules:
  catalog:
    enabled: true
    datasource:
      url: jdbc:postgresql://localhost:5432/macro
      username: catalog_app
      password: catalog_app
      migration-username: catalog_migrator
      migration-password: catalog_migrator

