site_name: microlith
site_description: One Spring Boot codebase that runs as a monolith or as services, chosen by configuration, with measurements of what each shape costs.
site_url: https://johnjoeallen.github.io/microlith/
repo_url: https://github.com/johnjoeallen/microlith
repo_name: johnjoeallen/microlith
edit_uri: edit/main/docs/

docs_dir: docs
exclude_docs: |
  generated/
  db/
  performance/_generated/

validation:
  omitted_files: info
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.tabs.link
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - def_list
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.snippets:
      base_path: docs
      check_paths: true

extra_css:
  - stylesheets/extra.css

plugins:
  - search

extra:
  version:
    provider: mike

nav:
  - Home: index.md
  - Architecture: architecture.md
  - The case: case.md
  - Principles: principles.md
  - Deployment modes:
      - Overview: modes/index.md
      - One process: modes/single-process.md
      - Split across processes: modes/split.md
  - Optional features:
      - Result cache (@Cached): features/cache.md
      - Parallel quotes: features/parallel.md
      - Follow-up delivery (outbox or events): features/follow-ups.md
  - Performance:
      - Summary: performance/index.md
      - Method: performance/method.md
      - The eight modes: performance/modes.md
      - Cache and parallel quotes: performance/switches.md
      - Follow-up delivery: performance/load.md
      - Every combination: performance/matrix.md
      - Wire formats (gzip, BSON): performance/wire-formats.md
      - JVM settings (heap, C2, GC): performance/jvm-settings.md
      - Raw reports:
          - Overview: performance/reports.md
          - Modes, cache off and on: performance/reports/modes-cache.md
          - Full matrix:
              - modulith: performance/reports/matrix/modulith.md
              - macro-modulith: performance/reports/matrix/macro-modulith.md
              - loopback-codec: performance/reports/matrix/loopback-codec.md
              - loopback-http: performance/reports/matrix/loopback-http.md
              - groups: performance/reports/matrix/groups.md
              - split-dbs: performance/reports/matrix/split-dbs.md
              - microservices: performance/reports/matrix/microservices.md
              - microservices-macro: performance/reports/matrix/microservices-macro.md
              - modulith, 8 instances: performance/reports/matrix/modulith-8db.md
              - macro-modulith, 8 instances: performance/reports/matrix/macro-modulith-8db.md
              - loopback-codec, 8 instances: performance/reports/matrix/loopback-codec-8db.md
              - loopback-http, 8 instances: performance/reports/matrix/loopback-http-8db.md
              - groups, 8 instances: performance/reports/matrix/groups-8db.md
          - Alternating shared and 8 instances:
              - Repetition 1: performance/reports/alternating/rep1.md
              - Repetition 2: performance/reports/alternating/rep2.md
              - Repetition 3: performance/reports/alternating/rep3.md
          - Wire formats, realistic orders: performance/reports/wire-small.md
          - Wire formats, 40 lines: performance/reports/wire-lines40.md
          - Wire formats, 150 lines: performance/reports/wire-lines150.md
          - JVM 2 GB, C1 and serial GC: performance/reports/jvm-c1-2g.md
          - JVM 2 GB, C2 and parallel GC: performance/reports/jvm-c2-parallel.md
          - JVM 2 GB, C2, split-dbs rerun: performance/reports/jvm-c2-parallel-rerun-split-dbs.md
  - Running it: running.md
  - Reference:
      - Developer guide: README-dev.md
      - Project reference: reference.md
      - Glossary: glossary.md
      - Design: design/macro-service.md
      - "Discussion: Spring Modulith async": design/spring-modulith-async.md
      - "Spike: Spring Modulith events": design/spring-modulith-events.md
      - Build plan: design/staged-prompt.md
